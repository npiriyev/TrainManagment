<div class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h2>Sign Up</h2>
      <button class="close-button" (click)="onClose()">×</button>
    </div>
    
    <form (ngSubmit)="onSign()">
      <div class="modal-body">
        <!-- Error message display -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>
        
        <div class="form-group">
          <label for="email">Email:</label>
          <input 
            type="email" 
            id="email" 
            [(ngModel)]="email" 
            name="email"
            class="form-control"
            placeholder="Enter your email">
        </div>
        
        <div class="form-group">
          <label for="password">Password:</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password"
            class="form-control"
            placeholder="Enter your password">
          <div class="password-requirements">
            Password must:
            <ul>
              <li>Be at least 6 characters long</li>
              <li>Contain at least one uppercase letter (A-Z)</li>
              <li>Contain at least one lowercase letter (a-z)</li>
              <li>Contain at least one digit (0-9)</li>
              <li>Contain at least one non-alphanumeric character (!#$%^&*)</li>
            </ul>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button type="button" class="cancel-button" (click)="onClose()">Cancel</button>
        <button 
          type="submit"
          class="sign-button" 
          [disabled]="!email || !password || isLoading">
          <span *ngIf="isLoading">Loading...</span>
          <span *ngIf="!isLoading">Sign Up</span>
        </button>
      </div>
    </form>
  </div>
</div>
