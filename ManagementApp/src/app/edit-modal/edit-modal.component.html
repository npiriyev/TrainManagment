<!-- edit-modal.component.html -->
<div class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h2>Edit {{train.name}} Quantity</h2>
        <button class="close-button" (click)="onClose()">×</button>
      </div>
      
      <div class="modal-body">
        <div *ngIf="train">
          <p><strong>ID:</strong> {{train.id}}</p>
          <p><strong>Unique Number:</strong> {{train.uniqueNumber}}</p>
          
          <div class="form-group">
            <label for="quantity">Quantity:</label>
            <input 
              type="number" 
              id="quantity" 
              [(ngModel)]="quantity" 
              min="0"
              class="form-control"
              [class.is-invalid]="errorMessage">
              <div *ngIf="errorMessage" class="invalid-feedback">
                {{ errorMessage }}
              </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <button class="cancel-button" (click)="onClose()">Cancel</button>
        <button class="save-button" (click)="onSave()" [disabled]="quantity === null">Save</button>
      </div>
    </div>
  </div>
